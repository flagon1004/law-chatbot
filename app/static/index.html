<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>법령 AI 챗봇</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">

    <!-- 사이드바 -->
    <aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <img src="/static/logo.jpg" class="logo-icon" alt="로고">
      <span class="logo-text">법령 AI</span>
    </div>
    <p class="logo-sub">법제처 기반 법령 검색</p>
  </div>
  <div class="sidebar-body">
    <button class="btn-new-chat" onclick="newChat()">+ 새 대화</button>
    <div id="session-list" class="session-list"></div>
    <div class="hint-section">
      <p class="hint-title">질문 예시</p>
      <button class="hint-btn" onclick="useHint(this)">전세 계약이 끝났는데 집주인이 보증금을 돌려주지 않고 계속 미루고 있습니다. 어떻게 해야 하나요?</button>
      <button class="hint-btn" onclick="useHint(this)">회사에서 갑자기 권고사직을 요구하는데 거부하면 해고할 수 있나요?</button>
      <button class="hint-btn" onclick="useHint(this)">결혼 후 함께 마련한 아파트가 배우자 명의인데 이혼하면 재산분할을 받을 수 있나요?</button>
      <button class="hint-btn" onclick="useHint(this)">친구에게 2,000만 원을 빌려줬는데 차용증은 없고 계좌이체 내역만 있습니다. 돈을 받을 수 있을까요?</button>
      <button class="hint-btn" onclick="useHint(this)">교통사고 후 보험사에서 합의금을 제시했는데 적정한 금액인지 확인받고 싶습니다.</button>
    </div>
  </div>
  <div class="sidebar-footer">
    <label for="model-select" class="model-label">AI 모델</label>
    <select id="model-select" class="model-select" onchange="onModelChange(this.value)">
      <option value="nvidia" selected>NVIDIA Nemotron Ultra</option>
      <option value="gemini">🔒 Gemini 3.5 Flash (관리자 전용)</option>
    </select>
  </div>
</aside>

    <!-- 메인 채팅 영역 -->
    <main class="main">
      <header class="chat-header">
         <button class="menu-btn" onclick="toggleSidebar()">☰</button>
         <span class="chat-title">법령 AI 챗봇</span>
         <span class="chat-sub">법제처 Open API 연동</span>
      </header>

      <div class="messages" id="messages">
        <div class="welcome">
          <img src="/static/logo.jpg" class="welcome-icon" alt="로고">
          <h2>법적 근거를 알고 싶으신가요?</h2>
          <p>궁금한 내용을 질문해 주세요.<br>법제처 데이터를 기반으로 답변을 제공합니다.<br>Designed by Han Sang Hoon</p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-box">
          <textarea
            id="user-input"
            placeholder="법령에 대해 질문하세요..."
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <p class="input-note">AI 답변은 참고용입니다. 법적 효력은 전문가에게 확인하세요.<br>Designed by Han Sang Hoon</p>
      </div>
    </main>

  </div>
  <script src="/static/app.js"></script>
</body>
</html>
