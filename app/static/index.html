<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>법령 AI 챗봇</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">

    <!-- 사이드바 -->
    <aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <img src="/static/logo.jpg" class="logo-icon" alt="로고">
      <span class="logo-text">법령 AI</span>
    </div>
    <p class="logo-sub">법제처 기반 법령 검색</p>
  </div>
  <div class="sidebar-body">
    <button class="btn-new-chat" onclick="newChat()">+ 새 대화</button>
    <div id="session-list" class="session-list"></div>
    <div class="hint-section">
      <p class="hint-title">질문 예시</p>
      <button class="hint-btn" onclick="useHint(this)">전세사기가 의심되는 경우, 계약을 취소할 수 있나요?</button>
      <button class="hint-btn" onclick="useHint(this)">건물 다 지었는데 사용승인 받으려면 서류 뭐 내야하고 얼마나 걸리나요?</button>
      <button class="hint-btn" onclick="useHint(this)">횡단보도에서 자전거와 차량이 충돌한 경우 법적처벌은 어떻게 되는가요?</button>
      <button class="hint-btn" onclick="useHint(this)">도심 공사현장에서 밤에 작업하면 소음 때문에 민원 들어오는데, 법적으로 몇 시까지 가능한가요?</button>
      <button class="hint-btn" onclick="useHint(this)">공사 중 사망사고 났을 때 현장소장이나 대표이사가 받을 수 있는 처벌은 어떻게 되나요?</button>
    </div>
  </div>
  <div class="sidebar-footer">
    <label for="model-select" class="model-label">AI 모델</label>
    <select id="model-select" class="model-select" onchange="onModelChange(this.value)">
      <option value="nvidia" selected>NVIDIA Nemotron Ultra</option>
      <option value="gemini">🔒 Gemini 3.5 Flash (관리자 전용)</option>
    </select>
  </div>
</aside>

    <!-- 메인 채팅 영역 -->
    <main class="main">
      <header class="chat-header">
         <button class="menu-btn" onclick="toggleSidebar()">☰</button>
         <span class="chat-title">법령 AI 챗봇</span>
         <span class="chat-sub">법제처 Open API 연동</span>
      </header>

      <div class="messages" id="messages">
        <div class="welcome">
          <img src="/static/logo.jpg" class="welcome-icon" alt="로고">
          <h2>법적 근거를 알고 싶으신가요?</h2>
          <p>궁금한 내용을 질문해 주세요.<br>법제처 데이터를 기반으로 답변을 제공합니다.<br>Designed by Han Sang Hoon</p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-box">
          <textarea
            id="user-input"
            placeholder="법령에 대해 질문하세요..."
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <p class="input-note">AI 답변은 참고용입니다. 법적 효력은 전문가에게 확인하세요.<br>Designed by Han Sang Hoon</p>
      </div>
    </main>

  </div>
  <script src="/static/app.js"></script>
</body>
</html>
