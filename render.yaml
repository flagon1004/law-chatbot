services:
  - type: web
    name: law-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LAW_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
